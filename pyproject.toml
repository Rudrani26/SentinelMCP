[project]
name = "sentinelmcp"
version = "0.0.1"
description = "A Python authorization gateway for MCP tool servers."
requires-python = ">=3.12"
dependencies = [
    "mcp==2.2.0",
    "uvicorn>=0.31.1",
    "PyYAML>=6.0",
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
